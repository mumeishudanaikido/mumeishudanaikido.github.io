<footer class="site-footer">
    <div class="container">
        <div class="footer-content">
            <p class="footer-copyright">&copy; {{ 'now' | date: "%Y" }} {{ site.dojo.name }}. All rights reserved.</p>
            <div class="social-links">
                <a href="tel:{{ site.dojo.phone | replace: ' ', '' }}" aria-label="Call us">
                    <i class="fas fa-phone"></i>
                </a>
                <a href="mailto:{{ site.dojo.email }}" aria-label="Email us">
                    <i class="fas fa-envelope"></i>
                </a>
                {% if site.social.facebook %}
                <a href="{{ site.social.facebook }}" target="_blank" rel="noopener" aria-label="Facebook">
                    <i class="fab fa-facebook"></i>
                </a>
                {% endif %}
                <a href="{{ site.social.instagram_feed_url }}" target="_blank" rel="noopener" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
            </div>
        </div>
    </div>
</footer>
