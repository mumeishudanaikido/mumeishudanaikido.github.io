<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ site.description }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Noto+Serif+JP:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Mobile-optimized CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/mobile.css' | relative_url }}">
</head>
<body>
    {% include mobile-header.html %}

    <main>
        {{ content }}
    </main>

    {% include footer.html %}

    <!-- Custom JavaScript (mobile nav toggle reuses the same handlers) -->
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
